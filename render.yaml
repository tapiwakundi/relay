services:
  - type: web
    name: relay-api
    runtime: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile=false && pnpm --filter @relay/shared build && pnpm --filter @relay/api build
    startCommand: pnpm --filter @relay/api start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"

  - type: web
    name: relay-web
    runtime: static
    buildCommand: pnpm install --frozen-lockfile=false && pnpm --filter @relay/web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
