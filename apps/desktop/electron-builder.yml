appId: com.endurancelabs.relaydesktop
productName: Relay
copyright: Copyright © Endurance Labs
directories:
  buildResources: packaging
  output: release
files:
  - out/**/*
  - package.json
extraMetadata:
  main: out/main/index.js
asar: true
npmRebuild: false
artifactName: Relay-${os}-${arch}.${ext}
# Legacy NSIS 3.0.4 ships an Intel-only makensis, which cannot start on Apple Silicon without Rosetta.
toolsets:
  nsis: "1.2.1"
publish:
  provider: github
  owner: tapiwakundi
  repo: relay
  releaseType: release
mac:
  category: public.app-category.social-networking
  icon: packaging/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
  entitlements: packaging/entitlements.mac.plist
  entitlementsInherit: packaging/entitlements.mac.inherit.plist
  minimumSystemVersion: "12.0"
  extendInfo:
    NSMicrophoneUsageDescription: Relay uses the microphone for huddles.
    NSCameraUsageDescription: Relay uses the camera for huddles.
    NSScreenCaptureUsageDescription: Relay records the screen only while you share it in a huddle.
protocols:
  - name: Relay
    schemes:
      - com.endurancelabs.relaydesktop
      - relay
win:
  icon: packaging/icon-1024.png
  # Unsigned Windows builds cannot pass electron-updater's signature check.
  # Set this to true after WIN_CSC_LINK signing is in place.
  verifyUpdateCodeSignature: false
  target:
    - target: nsis
      arch:
        - x64
